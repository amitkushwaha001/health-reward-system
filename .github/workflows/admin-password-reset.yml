name: One-time admin password reset

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-password-reset
  cancel-in-progress: false

jobs:
  reset-admin:
    if: github.ref == 'refs/heads/main'
    environment: admin-password-reset
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Reset the existing admin account
        working-directory: backend
        run: npm run reset-admin
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ADMIN_RESET_PASSWORD: ${{ secrets.ADMIN_RESET_PASSWORD }}
          ADMIN_RESET_CONFIRM_EMAIL: amitkushwaha200215@gmail.com
